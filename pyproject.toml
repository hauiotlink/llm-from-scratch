[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Building, Optimizing, and Aligning Large Language Models from Scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "datasets>=2.18.0",
    "regex>=2023.12.25",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["configs", "core", "data", "profiling"]
